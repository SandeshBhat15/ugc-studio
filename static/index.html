<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>UGC Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08090b; --surface:#0f1114; --surface-2:#14171b; --surface-3:#1a1e24;
  --line:#23272e; --line-soft:#1a1d22; --text:#f1f2f4; --muted:#98a0ab; --dim:#69717d;
  --accent:#d7ff3f; --accent-soft:rgba(215,255,63,.12); --ink:#0a0b06;
  --info:#8b95ff; --ok:#3ed598; --warn:#ffb020; --err:#ff6b6b;
  --r:14px; --r-sm:9px; --shadow:0 24px 70px -24px rgba(0,0,0,.85);
  --font:"Instrument Sans",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:14.5px/1.55 var(--font);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
::selection{background:var(--accent);color:var(--ink)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#262b33;border-radius:99px;border:2px solid var(--bg)}
a{color:inherit}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.02em}
p{margin:0}
input,textarea,select{font:inherit;color:var(--text);background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;width:100%;
  transition:border-color .15s,box-shadow .15s,background .15s}
input:hover,textarea:hover,select:hover{border-color:#2e343d}
input:focus,textarea:focus,select:focus{outline:none;border-color:#4b5563;
  box-shadow:0 0 0 3px rgba(215,255,63,.13);background:#16191e}
input::placeholder,textarea::placeholder{color:#5d6570}
textarea{resize:vertical;min-height:90px;line-height:1.55}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#7b8390 50%),linear-gradient(135deg,#7b8390 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px,5px 5px;
  background-repeat:no-repeat;padding-right:34px}
input[type=checkbox]{appearance:none;width:16px;height:16px;padding:0;margin:0;
  border:1px solid #3d4652;border-radius:4px;background:#12151a;display:inline-grid;
  place-items:center;cursor:pointer;transition:background .14s,border-color .14s;flex:0 0 16px}
input[type=checkbox]:hover{border-color:#5a6472}
input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
input[type=checkbox]:checked:after{content:"";width:7px;height:4px;
  border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);
  transform:rotate(-45deg) translateY(-1px)}
label{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);margin:0 0 7px;font-weight:600}
.hidden{display:none!important}
.mono{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.muted{color:var(--muted)}
.dim{color:var(--dim)}
.spacer{flex:1}

/* ------------------------------------------------------------ shell */
.shell{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:16px;
  padding:18px 14px;border-right:1px solid var(--line);
  background:linear-gradient(180deg,#0c0e11 0%,#08090b 100%)}
.brand{display:flex;align-items:center;gap:11px;padding:2px 6px 4px}
.logo{width:36px;height:36px;border-radius:11px;background:var(--accent);color:var(--ink);
  display:grid;place-items:center;font-weight:700;font-size:17px;
  box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px -8px rgba(215,255,63,.6)}
.brand h1{font-size:15px;letter-spacing:-.01em}
.brand small{display:block;color:var(--dim);font-size:10.5px;font-weight:500;
  letter-spacing:.04em;text-transform:uppercase;margin-top:1px}
.side-search{position:relative}
.side-search input{padding:9px 11px;font-size:13px;background:#0b0d10}
.side-head{display:flex;align-items:center;justify-content:space-between;padding:0 6px}
.side-head h2{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:600}
.plist{display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1;margin:0 -4px;padding:0 4px}
.pitem{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:10px;
  cursor:pointer;border:1px solid transparent;transition:.14s;min-width:0;text-align:left}
.pitem:hover{background:#12151a}
.pitem.active{background:#151920;border-color:#252b34}
.pitem .pdot{width:7px;height:7px;border-radius:50%;background:#3a4048;flex:0 0 7px}
.pitem[data-status="review"] .pdot{background:var(--warn)}
.pitem[data-status="planning"] .pdot{background:var(--info)}
.pitem[data-status="editing"] .pdot{background:var(--accent)}
.pitem[data-status="completed"] .pdot{background:var(--ok)}
.pitem .pmeta{min-width:0;flex:1}
.pitem b{display:block;font-weight:550;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem span{display:block;color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line-soft);padding-top:12px}
.health{display:flex;flex-direction:column;gap:5px;padding:2px 6px 0;font-size:11px}
.health div{display:flex;align-items:center;gap:7px;color:var(--muted)}
.health i{width:6px;height:6px;border-radius:50%;background:#3a4048;flex:0 0 6px}
.health i.on{background:var(--ok);box-shadow:0 0 8px rgba(62,213,152,.7)}
.health i.off{background:var(--err)}

/* ------------------------------------------------------------ main */
.main{padding:26px 34px 110px;max-width:1480px;width:100%;margin:0 auto;min-width:0}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;
  flex-wrap:wrap;margin-bottom:20px}
.topbar h2{font-size:27px;letter-spacing:-.035em;line-height:1.15}
.topbar .meta{color:var(--muted);font-size:13px;margin-top:5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.topbar .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.crumb{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
  font-weight:600;margin-bottom:6px}

/* ------------------------------------------------------------ buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 14px;border-radius:var(--r-sm);background:var(--surface-2);color:var(--text);
  border:1px solid var(--line);font-size:13.5px;font-weight:550;white-space:nowrap;
  transition:background .14s,border-color .14s,transform .08s,color .14s}
.btn:hover{background:#1c2027;border-color:#333a44}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:none;box-shadow:0 0 0 3px var(--accent-soft),0 0 0 1px var(--accent)}
.btn.primary{background:var(--accent);color:var(--ink);border-color:var(--accent);font-weight:650}
.btn.primary:hover{background:#e2ff6a;border-color:#e2ff6a}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:#14171c;color:var(--text);border-color:transparent}
.btn.outline{background:transparent}
.btn.danger{color:#ff8f8f;border-color:#3a2326;background:rgba(255,107,107,.05)}
.btn.danger:hover{background:rgba(255,107,107,.12);border-color:#5a2f34}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn.icon{padding:8px;width:34px;height:34px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.primary:disabled{background:#5d6b24;border-color:#5d6b24;color:#c9d3a8}

/* ------------------------------------------------------------ chips */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;
  font-size:10.5px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;
  border:1px solid var(--line);background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip i{width:5px;height:5px;border-radius:50%;background:currentColor}
.chip.ok{color:#7cebb6;border-color:#1d4433;background:rgba(62,213,152,.07)}
.chip.warn{color:#ffc861;border-color:#4a3714;background:rgba(255,176,32,.07)}
.chip.err{color:#ff9b9b;border-color:#4a2428;background:rgba(255,107,107,.07)}
.chip.run{color:var(--accent);border-color:#3f4a17;background:rgba(215,255,63,.07)}
.chip.info{color:#aab1ff;border-color:#2b3160;background:rgba(139,149,255,.07)}

/* ------------------------------------------------------------ cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:20px 22px;margin-bottom:16px;position:relative}
.card.flush{padding:0;overflow:hidden}
.card h3{font-size:15.5px;display:flex;align-items:center;gap:8px}
.card .sub{color:var(--muted);font-size:12.8px;margin:4px 0 16px;max-width:70ch}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
  flex-wrap:wrap;margin-bottom:16px}
.card-head .sub{margin:4px 0 0}
.grid{display:grid;gap:14px}
.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1100px){.c3,.c4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:720px){.c2,.c3,.c4{grid-template-columns:1fr}}
.field-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ------------------------------------------------------------ stage rail */
.rail{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:18px}
.railstep{display:flex;align-items:center;gap:11px;padding:13px 15px;cursor:pointer;
  border-right:1px solid var(--line-soft);transition:background .14s;min-width:0;text-align:left}
.railstep:last-child{border-right:none}
.railstep:hover{background:#13161b}
.railstep .rn{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
  font-family:var(--mono);font-size:11px;background:#191d23;color:var(--dim);
  border:1px solid #262b33;flex:0 0 26px}
.railstep.done .rn{background:rgba(62,213,152,.12);color:#7cebb6;border-color:#1d4433}
.railstep.active .rn{background:var(--accent-soft);color:var(--accent);border-color:#3f4a17}
.railstep.warn .rn{background:rgba(255,176,32,.1);color:#ffc861;border-color:#4a3714}
.railstep.fail .rn{background:rgba(255,107,107,.1);color:#ff9b9b;border-color:#4a2428}
.railstep .rl{min-width:0;flex:1}
.railstep b{display:block;font-size:12.8px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.railstep span{display:block;font-size:10.5px;color:var(--dim);text-transform:capitalize;white-space:nowrap}
@media(max-width:820px){.rail{grid-template-columns:1fr 1fr}.railstep:nth-child(2){border-right:none}}

/* ------------------------------------------------------------ tabs */
.tabs{display:flex;gap:2px;margin-bottom:18px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{padding:10px 12px;color:var(--muted);border-bottom:2px solid transparent;
  font-size:13.5px;font-weight:550;transition:.14s;white-space:nowrap;margin-bottom:-1px}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text);border-bottom-color:var(--accent)}
.tab .cnt{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-left:5px}

/* ------------------------------------------------------------ job bar */
.jobbar{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;
  background:#101308;border:1px solid #333d16;border-radius:var(--r);padding:11px 15px;
  margin-bottom:16px;font-size:13px;color:#dbe6b0}
.jobbar .track{position:absolute;left:0;right:0;bottom:0;height:2px;background:#2a3212;overflow:hidden}
.jobbar .track:after{content:"";position:absolute;top:0;left:-40%;width:40%;height:100%;
  background:var(--accent);animation:slide 1.3s ease-in-out infinite}
@keyframes slide{0%{left:-40%}100%{left:100%}}

/* ------------------------------------------------------------ scenes */
.scenes{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px}
.scene{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;display:flex;flex-direction:column;transition:border-color .16s,transform .16s}
.scene:hover{border-color:#313842}
.scene .thumb{position:relative;height:300px;background:#060708;display:grid;place-items:center;overflow:hidden}
.scene .thumb img,.scene .thumb video{width:100%;height:100%;object-fit:contain;display:block}
.scene .thumb .empty{color:#414852;font-size:12px;text-align:center;padding:24px;line-height:1.5}
.scene .overlay{position:absolute;top:9px;left:9px;right:9px;display:flex;
  justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.scene .overlay>*{pointer-events:auto}
.playbadge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44px;height:44px;
  border-radius:50%;background:rgba(8,9,11,.66);border:1px solid rgba(255,255,255,.2);
  display:grid;place-items:center;color:#fff;font-size:13px;pointer-events:none;
  backdrop-filter:blur(4px)}
.pick{display:grid;place-items:center;width:24px;height:24px;border-radius:7px;
  background:rgba(8,9,11,.75);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(6px)}
.scene .sbody{padding:13px 14px 14px;display:flex;flex-direction:column;gap:9px;flex:1}
.scene .sn{display:flex;align-items:center;justify-content:space-between;gap:8px}
.scene .sn b{font-size:13px}
.scene .prompt{font-size:11.8px;color:var(--muted);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.scene .meta{font-family:var(--mono);font-size:10.5px;color:var(--dim);display:flex;gap:8px;flex-wrap:wrap}
.scene .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:2px}
.qcline{font-size:11px;line-height:1.45;color:var(--warn)}
.qcline.err{color:var(--err)}

/* ------------------------------------------------------------ table */
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
table.tbl{width:100%;border-collapse:collapse;font-size:12.8px;min-width:760px}
.tbl th{position:sticky;top:0;background:#101317;text-align:left;color:var(--dim);
  font-weight:600;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  padding:10px 12px;border-bottom:1px solid var(--line);z-index:1;white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:#12151a}
.tbl td input,.tbl td textarea{padding:7px 9px;font-size:12px;background:#0e1115;border-color:transparent}
.tbl td input:hover,.tbl td textarea:hover{border-color:#262c34}
.tbl td textarea{min-height:52px;max-height:220px;field-sizing:content;line-height:1.5}
.tbl .num{font-family:var(--mono);color:var(--dim);font-size:11px}
.iconbtn{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;
  color:var(--dim);transition:.14s}
.iconbtn:hover{background:#1b1f26;color:var(--text)}

/* ------------------------------------------------------------ files */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.fchip{padding:6px 11px;border-radius:99px;font-size:12px;color:var(--muted);
  border:1px solid var(--line);background:transparent;transition:.14s}
.fchip:hover{color:var(--text);border-color:#333a44}
.fchip.active{background:var(--surface-3);color:var(--text);border-color:#3a424e}
.frow{display:grid;grid-template-columns:34px minmax(0,1fr) 84px 92px 128px;gap:10px;
  align-items:center;padding:9px 12px;border-bottom:1px solid var(--line-soft);font-size:12.8px}
.frow:last-child{border-bottom:none}
.frow:hover{background:#12151a}
.fico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  background:#191d23;color:var(--muted);font-size:11px;font-family:var(--mono)}
.frow .fname{min-width:0}
.frow .fname b{display:block;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow .fname span{display:block;color:var(--dim);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow .fsize,.frow .fdate{font-family:var(--mono);font-size:10.8px;color:var(--dim)}
.frow .facts{display:flex;gap:2px;justify-content:flex-end}
@media(max-width:820px){.frow{grid-template-columns:34px minmax(0,1fr) 110px}.frow .fsize,.frow .fdate{display:none}}

/* ------------------------------------------------------------ dropzone */
.dz{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  border:1.5px dashed #2b313a;border-radius:12px;padding:18px 14px;text-align:center;
  color:var(--muted);font-size:12.5px;cursor:pointer;transition:.16s;background:#0b0d10}
.dz:hover{border-color:#46505c;color:var(--text);background:#0e1116}
.dz.over{border-color:var(--accent);background:rgba(215,255,63,.06);color:var(--text)}
.dz b{font-size:12.8px;font-weight:600;color:var(--text)}
.dz .hint{font-size:10.8px;color:var(--dim);line-height:1.4}
.dz.slim{padding:12px;flex-direction:row;gap:9px;text-align:left}
.refs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ref{position:relative;width:72px}
.ref img{width:72px;height:72px;object-fit:cover;border-radius:9px;border:1px solid var(--line);display:block}
.ref .tag{display:block;font-size:9.5px;color:var(--dim);margin-top:4px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.ref .x{position:absolute;top:-5px;right:-5px;width:19px;height:19px;border-radius:50%;
  background:#1c2027;border:1px solid #333a44;color:var(--muted);font-size:12px;
  display:grid;place-items:center;line-height:1}
.ref .x:hover{background:var(--err);color:#160708;border-color:var(--err)}

/* ------------------------------------------------------------ misc */
.notice{padding:11px 13px;border-radius:10px;font-size:12.8px;margin:12px 0;white-space:pre-wrap}
.notice.err{background:rgba(255,107,107,.07);border:1px solid #432327;color:#ffa8a8}
.notice.ok{background:rgba(62,213,152,.07);border:1px solid #1d4433;color:#8ef0bd}
.notice.warn{background:rgba(255,176,32,.06);border:1px solid #4a3714;color:#ffce7a}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:9px;
  padding:56px 24px;color:var(--muted)}
.empty .eico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;
  background:var(--surface-2);border:1px solid var(--line);font-size:19px;color:var(--dim)}
.empty h3{font-size:16px;color:var(--text)}
.empty p{font-size:13px;max-width:44ch;line-height:1.55}
.empty .acts{margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.log{background:#070809;border:1px solid var(--line);border-radius:11px;padding:13px;
  font-family:var(--mono);font-size:11px;line-height:1.7;color:#8d96a2;max-height:220px;
  overflow:auto;white-space:pre-wrap}
.spin{width:13px;height:13px;border:2px solid #3a4048;border-top-color:var(--accent);
  border-radius:50%;animation:spin .7s linear infinite;display:inline-block;flex:0 0 13px}
@keyframes spin{to{transform:rotate(360deg)}}
.skeleton{background:linear-gradient(90deg,#12151a 25%,#191d23 37%,#12151a 63%);
  background-size:400% 100%;animation:sk 1.4s ease infinite;border-radius:8px}
@keyframes sk{0%{background-position:100% 0}100%{background-position:-100% 0}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12.5px}
.kv dt{color:var(--dim)}
.kv dd{margin:0;font-family:var(--mono);font-size:11.5px}
details{border-top:1px solid var(--line-soft);padding-top:12px;margin-top:12px}
summary{cursor:pointer;font-size:12.5px;color:var(--muted);font-weight:550;user-select:none}
summary:hover{color:var(--text)}
.savebar{position:sticky;bottom:14px;z-index:20;display:flex;align-items:center;gap:12px;
  justify-content:flex-end;background:rgba(15,17,20,.92);backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:13px;padding:11px 14px;margin-top:6px;box-shadow:var(--shadow)}
.savebar .msg{flex:1;font-size:12.5px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--dim);
  border:1px solid var(--line);border-radius:6px;padding:2px 6px;font-family:var(--mono)}
.bar{height:6px;background:#1a1e24;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.sep{height:1px;background:var(--line-soft);margin:16px 0}

/* ------------------------------------------------------------ modal + toast */
.modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:22px;
  background:rgba(3,4,6,.72);backdrop-filter:blur(7px);animation:fade .14s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:min(680px,100%);max-height:88vh;overflow:auto;background:var(--surface);
  border:1px solid #2b313a;border-radius:18px;box-shadow:var(--shadow);animation:rise .18s ease}
.sheet.wide{width:min(1040px,100%)}
@keyframes rise{from{transform:translateY(10px);opacity:.6}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
  padding:20px 22px 14px;border-bottom:1px solid var(--line-soft)}
.sheet-head h3{font-size:17px}
.sheet-head p{color:var(--muted);font-size:12.5px;margin-top:4px}
.sheet-body{padding:20px 22px}
.sheet-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px;
  border-top:1px solid var(--line-soft);position:sticky;bottom:0;background:var(--surface)}
.toasts{position:fixed;right:18px;bottom:18px;z-index:90;display:flex;flex-direction:column;
  gap:8px;max-width:380px}
.toast{display:flex;align-items:flex-start;gap:10px;background:#161a20;border:1px solid #2c333d;
  border-radius:11px;padding:11px 13px;font-size:12.8px;box-shadow:var(--shadow);
  animation:rise .18s ease;color:var(--text)}
.toast.ok{border-color:#1d4433}
.toast.err{border-color:#432327}
.toast .ti{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:1px}
.toast.ok .ti{color:var(--ok)}
.toast.err .ti{color:var(--err)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="logo">U</div>
      <div><h1>UGC Studio</h1><small>MiniMax H3</small></div>
    </div>
    <button class="btn primary" onclick="showNew()" style="width:100%">+ New project</button>
    <div class="side-search"><input id="psearch" placeholder="Search projects…" oninput="refreshProjectList()"/></div>
    <div class="side-head"><h2>Projects</h2><span class="mono" id="pcount"></span></div>
    <div class="plist" id="plist"></div>
    <div class="side-foot">
      <button class="btn ghost sm" onclick="showCharacters()" style="justify-content:flex-start">Characters</button>
      <button class="btn ghost sm" onclick="showInventory()" style="justify-content:flex-start">Model inventory</button>
      <button class="btn ghost sm" onclick="showSettings()" style="justify-content:flex-start">Settings</button>
      <div class="health" id="health"></div>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div id="modal-root"></div>
<div class="toasts" id="toast-root"></div>

<script>
/* ------------------------------------------------------------ helpers */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtSize = b => !b&&b!==0 ? '—' : b>=1073741824 ? (b/1073741824).toFixed(2)+' GB'
  : b>=1048576 ? (b/1048576).toFixed(1)+' MB' : b>=1024 ? Math.round(b/1024)+' KB' : b+' B';
const fmtNum = n => (n||0).toLocaleString();
function timeAgo(iso){
  if(!iso) return '—';
  const d = new Date(iso); if(isNaN(d)) return '—';
  const s = (Date.now()-d.getTime())/1000;
  if(s<60) return 'just now';
  if(s<3600) return Math.floor(s/60)+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago';
  if(s<604800) return Math.floor(s/86400)+'d ago';
  return d.toLocaleDateString();
}
const fileUrl = (pid,rel)=>`/api/file?project=${encodeURIComponent(pid)}&path=${encodeURIComponent(rel)}`;
const dlUrl = (pid,rel)=>`/api/file?project=${encodeURIComponent(pid)}&path=${encodeURIComponent(rel)}&download=1`;
const stagedUrl = p => `/api/staged?path=${encodeURIComponent(p)}`;

const CHIP = {
  completed:['ok','Completed'], approved:['ok','Approved'], ready:['ok','Ready'],
  generating:['run','Generating'], planning:['run','Planning'],
  awaiting_approval:['warn','Awaiting approval'], needs_attention:['warn','Needs attention'],
  failed:['err','Failed'], not_started:['','Not started'], draft:['','Draft'],
  review:['warn','In review'], editing:['run','Editing']
};
const chip = st => { const c = CHIP[st]||['',(st||'—').replace(/_/g,' ')]; return `<span class="chip ${c[0]}"><i></i>${esc(c[1])}</span>`; };
const humanStatus = st => { const s=String(st||'not started').replace(/_/g,' ').toLowerCase();
  return s.charAt(0).toUpperCase()+s.slice(1); };

/* ------------------------------------------------------------ state */
let S = {
  view:'home', tab:'brief', project:null, projects:[], inv:null, chars:[], files:null,
  settings:null, briefEdit:false, sel:{stills:new Set(), videos:new Set()}, fileFilter:'all',
  charDraft:{face:[],body:[],cloths:[],voice:null}, poll:null, elapsed:null, voices:[]
};

/* ------------------------------------------------------------ api */
async function api(path, opts={}){
  const r = await fetch(path, opts);
  const txt = await r.text();
  let data; try{ data = txt ? JSON.parse(txt) : {}; }catch{ data = {error:txt}; }
  if(!r.ok) throw new Error(data.error || ('HTTP '+r.status));
  return data;
}
const jpost = (p,b)=>api(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});
const jpatch = (p,b)=>api(p,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});

/* ------------------------------------------------------------ toast */
function toast(msg, kind='ok', ms=4600){
  const box = $('#toast-root');
  const el = document.createElement('div');
  el.className = 'toast '+kind;
  el.innerHTML = `<span class="ti">${kind==='err'?'!':'ok'}</span><div>${esc(msg)}</div>`;
  box.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),260); }, ms);
}
function fail(e){ toast(e?.message || String(e), 'err', 7000); }

/* ------------------------------------------------------------ modal */
function openModal(html, wide=false){
  $('#modal-root').innerHTML = `<div class="modal" onclick="if(event.target===this)closeModal()">
    <div class="sheet ${wide?'wide':''}" role="dialog" aria-modal="true">${html}</div></div>`;
  const first = $('#modal-root input, #modal-root textarea, #modal-root select');
  if(first) setTimeout(()=>first.focus(),40);
}
function closeModal(){ $('#modal-root').innerHTML=''; }
function askConfirm(title, message, confirmLabel='Delete', danger=true){
  return new Promise(resolve=>{
    openModal(`
      <div class="sheet-head"><div><h3>${esc(title)}</h3><p>${esc(message)}</p></div></div>
      <div class="sheet-foot">
        <button class="btn ghost" onclick="closeModal();__ask(false)">Cancel</button>
        <button class="btn ${danger?'danger':'primary'}" onclick="closeModal();__ask(true)">${esc(confirmLabel)}</button>
      </div>`);
    window.__ask = v => { resolve(v); delete window.__ask; };
  });
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

/* ------------------------------------------------------------ boot */
async function boot(){
  await refreshHealth();
  await refreshProjects();
  api('/api/voice/options').then(d=>{ S.voices = d.voices||[]; }).catch(()=>{});
  const last = localStorage.getItem('lastProject');
  if(last){
    try{ await openProject(last); return; }catch{}
  }
  showHome();
}
async function refreshHealth(){
  try{
    const h = await api('/api/health');
    const ll = h.llm||{};
    const planner = ll.has_gemini_key ? 'Gemini'
      : (ll.ollama?.available ? 'Ollama' : ll.lmstudio?.available ? 'LM Studio'
      : ll.has_openrouter_key ? 'OpenRouter' : 'Offline rules');
    $('#health').innerHTML = `
      <div><i class="${h.comfy_online?'on':'off'}"></i>ComfyUI ${h.comfy_online?'online':'offline'}</div>
      <div><i class="${planner==='Offline rules'?'':'on'}"></i>Planner · ${esc(planner)}</div>`;
  }catch{ $('#health').innerHTML = '<div><i class="off"></i>Backend offline</div>'; }
}
async function refreshProjects(){
  S.projects = await api('/api/projects');
  refreshProjectList();
}
function refreshProjectList(){
  const q = ($('#psearch')?.value || '').toLowerCase().trim();
  const list = S.projects.filter(p=>!q || (p.name||'').toLowerCase().includes(q)
    || (p.client||'').toLowerCase().includes(q));
  const box = $('#plist');
  $('#pcount').textContent = S.projects.length ? String(S.projects.length) : '';
  if(!list.length){
    box.innerHTML = `<div class="dim" style="padding:10px;font-size:12px">${q?'No match.':'No projects yet.'}</div>`;
    return;
  }
  box.innerHTML = list.map(p=>`
    <button class="pitem ${S.project&&S.project.id===p.id?'active':''}" data-status="${esc(p.status||'')}"
      onclick="openProject('${p.id}')">
      <span class="pdot"></span>
      <span class="pmeta"><b>${esc(p.name||'Untitled')}</b>
        <span>${esc(p.client||'No client')} · ${esc(p.status||'draft')}</span></span>
    </button>`).join('');
}

/* ------------------------------------------------------------ home */
function showHome(){
  S.view='home'; S.project=null; S.files=null;
  stopPolling();
  $('#main').innerHTML = `
    <div class="topbar">
      <div><div class="crumb">Studio</div><h2>Production dashboard</h2>
        <div class="meta">Plan, generate and export MiniMax H3 UGC ads — locally.</div></div>
      <div class="actions"><button class="btn primary" onclick="showNew()">+ New project</button></div>
    </div>
    <div id="setup"><div class="card"><div class="skeleton" style="height:96px"></div></div></div>
    <div class="card">
      <h3>How a project runs</h3>
      <p class="sub">Each stage has an approval gate. Nothing renders until you approve the previous step.</p>
      <div class="grid c4">
        ${[['01','Brief','Describe the product and paste the client brief.'],
           ['02','Plan','The planner writes the storyboard; you edit every line.'],
           ['03','Images','One locked creator, one still per scene — approve them.'],
           ['04','Video','Image-to-video with real speech, then stitched with burned-in text.']]
          .map(([n,t,d])=>`<div><div class="badge">STAGE ${n}</div>
            <b style="display:block;margin:9px 0 4px;font-size:13.5px">${t}</b>
            <p class="mono" style="line-height:1.55">${d}</p></div>`).join('')}
      </div>
    </div>
    <div id="recent"></div>`;
  renderSetup();
  renderRecent();
}
async function renderSetup(){
  const box = $('#setup'); if(!box) return;
  try{
    const [inv, ll] = await Promise.all([api('/api/inventory'), api('/api/llm/status')]);
    S.inv = inv;
    const c = inv.comfy||{}, h = inv.hardware||{}, dev = (h.devices||[])[0]||{};
    const issues = [];
    if(!c.online) issues.push('ComfyUI is not running — launch the ComfyUI Desktop app.');
    if((c.missing_required||[]).length) issues.push('Missing nodes: '+c.missing_required.join(', '));
    if(!ll.has_gemini_key && !ll.has_openrouter_key && !ll.ollama?.available && !ll.lmstudio?.available)
      issues.push('No AI planner configured — the built-in rule-based planner will be used.');
    box.innerHTML = `
      <div class="card">
        <div class="card-head"><div><h3>System check</h3>
          <p class="sub">Detected live on this machine.</p></div>
          ${issues.length?'<span class="chip warn"><i></i>Needs attention</span>':'<span class="chip ok"><i></i>All good</span>'}</div>
        <div class="grid c4">
          <div><label>ComfyUI</label><div style="margin-bottom:4px">${c.online?'<span class="chip ok"><i></i>online</span>':'<span class="chip err"><i></i>offline</span>'}</div>
            <div class="mono">v${esc(c.version||'?')} · ${fmtNum(c.classes)} nodes</div></div>
          <div><label>GPU</label><div style="font-size:13px">${esc((dev.name||'unknown').replace(/^cuda:\d+\s*/,'').split('\n')[0])}</div>
            <div class="mono">${dev.vram_total_gb||0} GB VRAM · ${dev.vram_free_gb||0} GB free</div></div>
          <div><label>Memory</label><div style="font-size:13px">${h.ram_total_gb||'?'} GB RAM</div>
            <div class="mono">${h.ram_free_gb||'?'} GB free</div></div>
          <div><label>Recommended profile</label><div style="font-size:13px">${esc(inv.recommended_profile||'draft')}</div>
            <div class="mono">${esc((inv.profiles?.[inv.recommended_profile]||{}).note||'')}</div></div>
        </div>
        ${issues.length?`<div class="notice warn">${issues.map(esc).join('\n')}</div>`
          :`<div class="notice ok">Everything needed is installed and running.</div>`}
      </div>`;
  }catch(e){ box.innerHTML = `<div class="card"><div class="notice err">${esc(e.message)}</div></div>`; }
}
function renderRecent(){
  const box = $('#recent'); if(!box) return;
  if(!S.projects.length){ box.innerHTML=''; return; }
  box.innerHTML = `<div class="card"><h3>Recent projects</h3>
    <p class="sub">Pick up where you left off.</p>
    <div class="grid c3">${S.projects.slice(0,6).map(p=>`
      <button class="pitem" style="border-color:var(--line);padding:13px" onclick="openProject('${p.id}')">
        <span class="pdot" data-status="${esc(p.status||'')}"></span>
        <span class="pmeta"><b>${esc(p.name||'Untitled')}</b>
          <span>${esc(p.client||'No client')} · ${esc(p.duration||15)}s · ${timeAgo(p.updated)}</span></span>
        ${chip(p.status)}
      </button>`).join('')}</div></div>`;
}

/* ------------------------------------------------------------ new project */
function showNew(){
  openModal(`
    <div class="sheet-head"><div><h3>New project</h3>
      <p>Everything here can be edited later.</p></div></div>
    <div class="sheet-body">
      <div class="grid c2">
        <div><label>Project name</label><input id="f_name" placeholder="Glow Serum Launch"/></div>
        <div><label>Client / brand</label><input id="f_client" placeholder="Lumière Skincare"/></div>
      </div>
      <div style="margin-top:14px"><label>Brief</label>
        <textarea id="f_brief" rows="6" placeholder="What is the product, who is it for, what should the ad achieve? Paste the client's brief here."></textarea></div>
      <div class="grid c2" style="margin-top:14px">
        <div><label>Duration</label><select id="f_dur">
          ${[5,10,15,20,30,45,60].map(v=>`<option value="${v}" ${v===15?'selected':''}>${v}s</option>`).join('')}</select></div>
        <div><label>Aspect</label><select id="f_aspect">
          <option value="9:16" selected>9:16 vertical</option><option value="1:1">1:1 square</option>
          <option value="16:9">16:9 landscape</option></select></div>
        <div><label>Platform</label><select id="f_platform">
          <option>Instagram Reels</option><option>YouTube Shorts</option><option>TikTok</option><option>Custom</option></select></div>
        <div><label>Style</label><select id="f_style">
          <option>talking-head UGC</option><option>testimonial</option><option>product demonstration</option>
          <option>lifestyle</option><option>unboxing</option><option>product-focused commercial</option></select></div>
      </div>
      <div class="grid c2" style="margin-top:14px">
        <div><label>Campaign objective</label><input id="f_objective" placeholder="Drive first purchases"/></div>
        <div><label>Concepts</label><input id="f_concepts" type="number" min="1" max="5" value="1"/></div>
      </div>
      <label style="display:flex;gap:9px;align-items:center;text-transform:none;font-size:13px;color:var(--text);margin-top:14px">
        <input type="checkbox" id="f_single"/>
        One continuous take — the camera never cuts, one unbroken spoken line</label>
      <div class="notice warn" style="margin-bottom:0">Longer videos become <b>more scenes</b>, not longer clips — one H3 generation tops out near 15 seconds. A 30 s ad is roughly 6 scenes.</div>
    </div>
    <div class="sheet-foot">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn primary" onclick="createProject()">Create project</button>
    </div>`);
}
async function createProject(){
  try{
    const body = {
      name:($('#f_name').value||'').trim()||'Untitled Project',
      client:($('#f_client').value||'').trim(),
      brief:($('#f_brief').value||'').trim(),
      duration:+$('#f_dur').value, aspect:$('#f_aspect').value,
      platform:$('#f_platform').value, style:$('#f_style').value,
      objective:($('#f_objective').value||'').trim(),
      concepts:+$('#f_concepts').value||1,
      single_take:$('#f_single').checked
    };
    if(!body.brief) throw new Error('Please paste the client brief.');
    const p = await jpost('/api/projects', body);
    closeModal(); await refreshProjects(); await openProject(p.id);
    toast('Project created.');
  }catch(e){ fail(e); }
}

/* ------------------------------------------------------------ project */
async function openProject(id){
  const p = await api('/api/projects/'+id);
  S.project = p; S.view='project'; S.files=null; S.briefEdit=false;
  S.sel={stills:new Set(),videos:new Set()};
  S.settings = await api('/api/settings').catch(()=>S.settings||{});
  localStorage.setItem('lastProject', id);
  await refreshProjectList();
  renderProject();
  startPolling();
}
function stageState(p,k){
  const s = p[k]||{};
  if(s.status==='completed'||s.status==='approved') return 'done';
  if(s.status==='failed') return 'fail';
  if(['awaiting_approval','needs_attention'].includes(s.status)) return 'warn';
  if(['generating','planning'].includes(s.status)) return 'active';
  return '';
}
const TAB_FOR_STAGE = {stage01:'plan', stage02:'stills', stage03:'video', stage04:'export'};
function renderProject(){
  const p = S.project; if(!p) return showHome();
  const s1=p.stage01||{}, s2=p.stage02||{}, s3=p.stage03||{}, s4=p.stage04||{};
  const job=p.job||{};
  const sceneCount=(s1.storyboard?.scenes||[]).length;
  const stills=Object.values(s2.scenes||{}).filter(x=>x.approved).length;
  const vids=Object.values(s3.scenes||{}).filter(x=>x.file).length;
  const rail = [
    ['stage01','01','Plan',humanStatus(s1.status)],
    ['stage02','02','Scene images',`${stills}/${sceneCount||'—'} approved`],
    ['stage03','03','Scene videos',`${vids}/${sceneCount||'—'} rendered`],
    ['stage04','04','Export',`${(s4.exports||[]).length} ${(s4.exports||[]).length===1?'file':'files'}`]
  ].map(([k,n,label,status])=>`
    <button class="railstep ${stageState(p,k)}" onclick="goTab('${TAB_FOR_STAGE[k]}')">
      <span class="rn">${n}</span>
      <span class="rl"><b>${label}</b><span>${esc(status)}</span></span>
    </button>`).join('');
  $('#main').innerHTML = `
    <div class="topbar">
      <div>
        <div class="crumb">Project</div>
        <h2>${esc(p.name||'Untitled')}</h2>
        <div class="meta">
          <span>${esc(p.client||'No client')}</span><span class="dim">·</span>
          <span>${esc(p.style||'')}</span><span class="dim">·</span>
          <span>${esc(p.duration||15)}s</span><span class="dim">·</span>
          <span>${esc(p.aspect||'9:16')}</span><span class="dim">·</span>
          <span>${esc(p.platform||'')}</span>
          ${p.updated?`<span class="dim">·</span><span class="dim">updated ${timeAgo(p.updated)}</span>`:''}
        </div>
      </div>
      <div class="actions">
        ${job.running?`<span class="chip run"><i class="spin" style="width:9px;height:9px;border-width:1.5px"></i>${esc(job.kind)}</span>`:''}
        <button class="btn sm" onclick="revealProject()">Open folder</button>
        <button class="btn sm" data-act="duplicate-project">Duplicate</button>
        <button class="btn sm danger" data-act="delete-project">Delete</button>
        <button class="btn sm" onclick="refreshNow(this)">Refresh</button>
      </div>
    </div>
    <div id="jobbar">${jobBar(p)}</div>
    <div class="rail">${rail}</div>
    <div class="tabs">
      ${[['brief','Brief'],['plan','Storyboard',sceneCount],['stills','Images',sceneCount],
         ['video','Videos',sceneCount],['export','Export',(s4.exports||[]).length],['files','Files']]
        .map(([k,label,cnt])=>`<button class="tab ${S.tab===k?'active':''}" data-tab="${k}"
          onclick="goTab('${k}')">${label}${cnt?`<span class="cnt">${cnt}</span>`:''}</button>`).join('')}
    </div>
    <div id="tabbody"></div>`;
  renderTab(S.tab);
  if(job.running) startElapsed(job.started);
}
function jobBar(p){
  const job=p.job||{};
  if(!job.running) return job.error?`<div class="notice err">${esc(job.error)}</div>`:'';
  return `<div class="jobbar"><span class="spin"></span>
    <span><b style="font-weight:600">${esc(job.kind)}</b> running — this keeps going if you close the tab.</span>
    <span class="spacer"></span><span class="mono" id="jobelapsed"></span>
    <div class="track"></div></div>`;
}
function startElapsed(started){
  clearInterval(S.elapsed);
  const tick=()=>{
    const el=$('#jobelapsed'); if(!el){clearInterval(S.elapsed);return;}
    const t=started?Math.max(0,(Date.now()-new Date(started).getTime())/1000):0;
    el.textContent = `${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')} elapsed`;
  };
  tick(); S.elapsed=setInterval(tick,1000);
}
function goTab(name){
  S.tab=name;
  $$('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===name));
  renderTab(name);
}
function renderTab(name){
  const p=S.project, box=$('#tabbody'); if(!box||!p) return;
  S.tab=name;
  if(name==='brief') return renderBrief(box,p);
  if(name==='plan') return renderPlan(box,p);
  if(name==='stills') return renderStills(box,p);
  if(name==='video') return renderVideos(box,p);
  if(name==='export') return renderExport(box,p);
  if(name==='files') return renderFiles(box,p);
}
async function refreshNow(btn){
  if(btn){ btn.disabled=true; btn.innerHTML='<span class="spin"></span>'; }
  try{ await refreshProject(true); }catch(e){ fail(e); }
  if(btn){ btn.disabled=false; btn.textContent='Refresh'; }
}
async function refreshProject(force=false){
  if(!S.project) return;
  const fresh = await api('/api/projects/'+S.project.id);
  S.project = fresh;
  if(S.view!=='project') return;
  const ae=document.activeElement;
  const typing = ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName) && $('#main')?.contains(ae);
  if(force || !typing) renderProject();
  else $('#jobbar').innerHTML = jobBar(fresh);
  refreshProjectList();
}
async function revealProject(){

function refBlock(p,kind,label,accept){
  const list=(p.refs||{})[kind]||[];

    return `<div class="ref">

        :`<img src="${fileUrl(p.id,r.file)}" alt="${esc(r.original||'')}" loading="lazy"/>`}
      <button class="x" title="Remove" data-act="del-ref" data-kind="${kind}" data-path="${esc(r.file)}">×</button>
      <span class="tag" title="${esc(r.original||'')}">${esc(r.original||r.file)}</span>

  }).join('');
  return `<div>
    <label>${esc(label)} ${list.length?`<span class="badge" style="margin-left:4px">${list.length}</span>`:''}</label>

}
function pickFiles(pid,kind,accept){
  const inp=document.createElement('input');
  inp.type='file'; inp.multiple=true; inp.accept=accept==='video'?'video/*':'image/*';

async function uploadProjectFiles(pid,kind,files){
  if(!files||!files.length) return;
  const fd=new FormData();
  fd.append('kind',kind);
  // Unique field names: the multipart parser keys files by field name.
  Array.from(files).forEach((f,i)=>fd.append('file'+i,f,f.name));
  try{
    const r=await api(`/api/projects/${pid}/upload`,{method:'POST',body:fd});
    toast(`${(r.added||[]).length} file(s) added to ${kind}.`);
    await refreshProject(true);
  }catch(e){ fail(e); }
}

function lookGate(p){
  const scenes=p.stage01?.storyboard?.scenes||[];
  if(!scenes.length) return '';
  const s2=p.stage02?.scenes||{};
  const first=s2['1']||{};
  const others=scenes.filter(s=>+s.n>1&&((s2[String(s.n)]||{}).file)).length;
  if(first.file&&first.approved) return '';
  if(first.file) return `<div class="notice warn">Scene 1 is rendered. Check the look, then approve it — the batch reuses the same character, lighting and framing.</div>`;
  if(others) return '';
  return `<div class="notice ok">Start with a <b>Look test</b>: it renders scene 1 only. Approving the look first costs one render; discovering it after the batch costs one per scene.</div>`;
}

async function doExport(){
  const p=S.project, f=p.stage01?.fields||{};
  const overlays=[];
  if($('#ov_brand')?.checked && (f.brand||p.name)) overlays.push({text:f.brand||p.name,pos:'top',size:0.055,bold:true});
  if($('#ov_cta')?.checked && f.cta) overlays.push({text:String(f.cta).replace(/^\s*(call\s*-?\s*to\s*-?\s*action|cta)\s*[:\-–]\s*/i,'').replace(/\.$/,''),pos:'lower',size:0.05,bold:true});
  const captions=$('#ov_caps')?.checked ?? true;
  const msg=$('#exmsg');
  if(msg) msg.innerHTML='<div class="notice ok"><span class="spin"></span> Stitching…</div>';
  try{
    await jpost(`/api/projects/${p.id}/export`,{overlays,captions});
    await refreshProject(true); goTab('export'); toast('Final video built.');
  }catch(e){ if(msg) msg.innerHTML=`<div class="notice err">${esc(e.message)}</div>`; fail(e); }
}

function charOptions(list,selected){
  return `<option value="">None — approved still only</option>`+
    (list||[]).map(c=>`<option value="${esc(c.name)}" ${selected===c.name?'selected':''}>${esc(c.name)} · ${c.size_mb} MB</option>`).join('');
}
function bindCharDrops(){
  $$('[data-char-drop]').forEach(dz=>{
    const role=dz.dataset.charDrop;
    dz.onclick=()=>pickCharFiles(role);
    dz.ondragover=e=>{e.preventDefault();dz.classList.add('over');};
    dz.ondragleave=()=>dz.classList.remove('over');
    dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');stageCharFiles(role,e.dataTransfer.files);};
  });
  const vz=$('#c_voice_dz');
  if(vz){
    vz.onclick=()=>{
      const inp=document.createElement('input'); inp.type='file'; inp.accept='audio/*';
      inp.onchange=()=>stageCharFiles('voice',inp.files); inp.click();
    };
    vz.ondragover=e=>{e.preventDefault();vz.classList.add('over');};
    vz.ondragleave=()=>vz.classList.remove('over');
    vz.ondrop=e=>{e.preventDefault();vz.classList.remove('over');stageCharFiles('voice',e.dataTransfer.files);};
  }
  renderCharDraft();
}
function pickCharFiles(role){
  const inp=document.createElement('input'); inp.type='file'; inp.multiple=true; inp.accept='image/*';
  inp.onchange=()=>stageCharFiles(role,inp.files); inp.click();
}
async function stageCharFiles(role,files){
  if(!files||!files.length) return;
  try{
    if(role==='voice'){
      if(files.length>1) return toast('Pick a single voice clip.','err');
      const [f]=await uploadStaged([files[0]]);
      S.charDraft.voice=f?.path||null;
    }else{
      const room=3-(S.charDraft[role]||[]).length;
      if(room<=0) return toast('Three images is the maximum for this role.','err');
      const up=await uploadStaged(Array.from(files).slice(0,room));
      S.charDraft[role]=(S.charDraft[role]||[]).concat(up);
    }
    renderCharDraft();
  }catch(e){ fail(e); }
}
function renderCharDraft(){
  const map={face:'#c_face_list',body:'#c_body_list',cloths:'#c_cloths_list'};
  Object.entries(map).forEach(([role,sel])=>{
    const box=$(sel); if(!box) return;
    const items=S.charDraft[role]||[];
    box.innerHTML=items.map((f,i)=>`<div class="ref">
      <img src="${stagedUrl(f.path)}" alt="" onerror="this.style.display='none'"/>
      <span class="tag" title="${esc(f.name)}">${esc(f.name)}</span>
      <button class="x" onclick="S.charDraft.${role}.splice(${i},1);renderCharDraft()">×</button>
    </div>`).join('');
  });
  const vl=$('#c_voice_list');
  if(vl){
    const v=S.charDraft.voice;
    vl.innerHTML=v?`<div class="ref" style="width:auto">
      <span class="badge">${esc(v.split(/[\\\\/]/).pop())}</span>
      <button class="x" style="position:static;margin-left:6px;display:inline-grid"
        onclick="S.charDraft.voice=null;renderCharDraft()">×</button></div>`:'';
  }
}
async function uploadStaged(files){
  const fd=new FormData();
  Array.from(files).forEach((f,i)=>fd.append('file'+i,f,f.name));
  const r=await api('/api/upload',{method:'POST',body:fd});
  return r.files||[];
}
async function createCharacter(){
  const name=($('#c_name').value||'').trim();
  const description=($('#c_desc').value||'').trim();
  const d=S.charDraft;
  const count=(d.face||[]).length+(d.body||[]).length+(d.cloths||[]).length;
  const msg=$('#c_msg');
  if(!name) return msg.innerHTML='<span style="color:var(--err)">Give the character a name.</span>';
  if(!description) return msg.innerHTML='<span style="color:var(--err)">A description is required — it is the text identity lock.</span>';
  if(!count) return msg.innerHTML='<span style="color:var(--err)">Add at least one image.</span>';
  msg.innerHTML='<span class="spin"></span> Encoding…';
  try{
    const r=await jpost('/api/characters',{
      name, description,
      face:(d.face||[]).map(x=>x.path),
      body:(d.body||[]).map(x=>x.path),
      cloths:(d.cloths||[]).map(x=>x.path),
      voice:d.voice
    });
    // A new character is what the user just asked for, so select it at once
    // instead of making them find a dropdown and save again.
    await jpost('/api/settings',{character:r.char});
    S.charDraft={face:[],body:[],cloths:[],voice:null};
    toast(`Created ${r.char} — now selected for every project.`);
    await refreshCharView();
  }catch(e){ msg.innerHTML=`<span style="color:var(--err)">${esc(e.message)}</span>`; }
}

function startPolling(){
  stopPolling();
  S.poll=setInterval(async ()=>{
    if(S.view!=='project'||!S.project) return;
    const p=S.project;
    const busy=p.job?.running || ['stage02','stage03'].some(k=>['generating','planning'].includes(p[k]?.status));
    if(!busy) return;
    try{ await refreshProject(); }catch{}
  },3500);
}
function stopPolling(){ if(S.poll) clearInterval(S.poll); S.poll=null; clearInterval(S.elapsed); }

/* ------------------------------------------------------------ delegation */
document.addEventListener('click', async e=>{
  const t=e.target.closest('[data-act]');
  if(!t) return;
  const act=t.dataset.act, n=t.dataset.n?+t.dataset.n:null;
  if(act==='approve-still'){ e.preventDefault(); return approveStill(n); }
  if(act==='regen-still'){ e.preventDefault(); return openRegenStill(n); }
  if(act==='replace-still'){ e.preventDefault(); return pickReplaceStill(n); }
  if(act==='look-test'){ e.preventDefault(); return genStills([1]); }
  if(act==='gen-all-stills'){ e.preventDefault(); return genStills(null); }
  if(act==='gen-selected-stills'){ e.preventDefault(); return genStills([...S.sel.stills]); }
  if(act==='gen-character'){ e.preventDefault(); return genCharacter(); }
  if(act==='voice-preview'){ e.preventDefault(); return previewVoice(); }
  if(act==='regen-video'){ e.preventDefault(); return openRegenVideo(n); }
  if(act==='gen-all-videos'){ e.preventDefault(); return genVideos(null); }
  if(act==='gen-selected-videos'){ e.preventDefault(); return genVideos([...S.sel.videos]); }
  if(act==='save-render'){ e.preventDefault(); return saveRenderSettings(); }
  if(act==='do-export'){ e.preventDefault(); return doExport(); }
  if(act==='preview'){ e.preventDefault(); return previewFile(t.dataset.path); }
  if(act==='del-file'){ e.preventDefault(); return deleteFile(t.dataset.path); }
  if(act==='del-ref'){ e.preventDefault(); return deleteFile(t.dataset.path); }
  if(act==='use-char'){ e.preventDefault(); return useCharacter(t.dataset.char); }
  if(act==='del-char'){ e.preventDefault(); return deleteCharacter(t.dataset.char); }
  if(act==='unuse-char'){ e.preventDefault(); return useCharacter(''); }
  if(act==='reveal-chars'){ e.preventDefault(); return revealCharacters(); }
  if(act==='duplicate-project'){ e.preventDefault(); return duplicateProject(); }
  if(act==='delete-project'){ e.preventDefault(); return deleteProject(); }
  if(act==='import-sheet'){ e.preventDefault(); return pickSheet(); }
  if(act==='reveal-files'){
    e.preventDefault();
    try{ await jpost('/api/reveal',{path:S.files.root}); }catch(err){ fail(err); }
    return;
  }
  if(act==='filter-files'){ e.preventDefault(); S.fileFilter=t.dataset.kind; return goTab('files'); }
});

  const p=e.target.closest('[data-pick]');
  if(!p) return;
  const set=S.sel[p.dataset.pick];
  const n=+p.dataset.n;
  p.checked?set.add(n):set.delete(n);
  // Re-render only the batch buttons, keeping scroll and focus intact.
  const p2=S.project;
  const label=p.dataset.pick==='stills'?'stills':'videos';
  const bar=p.closest('.card')?.querySelector('.field-row');
  if(bar){
    const old=bar.querySelector('.badge'); if(old) old.remove();
    const btn=bar.querySelector(`[data-act="gen-selected-${label}"]`);
    if(btn) btn.disabled=!set.size;
    if(set.size){ const b=document.createElement('span'); b.className='badge'; b.textContent=set.size+' selected';
      btn?.before(b); }
  }
});

/* ------------------------------------------------------------ drag + drop */
document.addEventListener('dragover', e=>{
  const dz=e.target.closest('.dz');
  if(dz){ e.preventDefault(); dz.classList.add('over'); }
});
document.addEventListener('dragleave', e=>{
  const dz=e.target.closest('.dz');
  if(dz) dz.classList.remove('over');
});
document.addEventListener('drop', e=>{
  const dz=e.target.closest('.dz');
  if(!dz) return;
  e.preventDefault(); dz.classList.remove('over');
  const kind=dz.dataset.dropKind;
  if(kind && S.project) return uploadProjectFiles(S.project.id,kind,e.dataTransfer.files);
});

boot();
</script>
</body>
</html>
